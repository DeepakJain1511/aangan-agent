<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="732" viewBox="0 0 2000 732" font-family="Arial, Helvetica, sans-serif">
<rect width="2000" height="732" fill="#faf8f5"/>
<text x="40" y="52" font-size="34" font-weight="700" fill="#1f2937">Components Map: Aangan Studio phone enquiry agent</text>
<text x="40" y="86" font-size="18" fill="#4b5563">Trigger → Input → Context → Processing → AI → Output. The AI extracts and converses; deterministic code decides.</text>
<rect x="40" y="110" width="300" height="40" rx="8" fill="#b45309"/>
<text x="190" y="137" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">TRIGGER</text>
<text x="350" y="137" font-size="24" fill="#6b7280" text-anchor="middle">›</text>
<rect x="40" y="164" width="300" height="110" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/>
<text x="54" y="191" font-size="17" font-weight="700" fill="#111827">Inbound phone call</text>
<text x="54" y="216" font-size="15" fill="#374151">Caller rings the studio's Vaani number</text>
<text x="54" y="238" font-size="15" fill="#374151">Answered instantly, day or night</text>
<text x="54" y="260" font-size="15" fill="#374151">(front desk covers only 10am-7pm)</text>
<rect x="40" y="288" width="300" height="110" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/>
<text x="54" y="315" font-size="17" font-weight="700" fill="#111827">Vaani call events</text>
<text x="54" y="340" font-size="15" fill="#374151">call_started: caller number</text>
<text x="54" y="362" font-size="15" fill="#374151">call_postprocessing: transcript,</text>
<text x="54" y="384" font-size="15" fill="#374151">recording, extracted fields</text>
<rect x="360" y="110" width="300" height="40" rx="8" fill="#a16207"/>
<text x="510" y="137" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">INPUT</text>
<text x="670" y="137" font-size="24" fill="#6b7280" text-anchor="middle">›</text>
<rect x="360" y="164" width="300" height="110" rx="10" fill="#fff" stroke="#a16207" stroke-width="2"/>
<text x="374" y="191" font-size="17" font-weight="700" fill="#111827">Webhook receiver</text>
<text x="374" y="216" font-size="15" fill="#374151">/api/webhooks/vaani?token=...</text>
<text x="374" y="238" font-size="15" fill="#374151">Secret-token check, fail closed</text>
<text x="374" y="260" font-size="15" fill="#374151">Invalid JSON rejected (400)</text>
<rect x="360" y="288" width="300" height="132" rx="10" fill="#fff" stroke="#a16207" stroke-width="2"/>
<text x="374" y="315" font-size="17" font-weight="700" fill="#111827">Payload parser (vaani.ts)</text>
<text x="374" y="340" font-size="15" fill="#374151">Join phone number by room_name</text>
<text x="374" y="362" font-size="15" fill="#374151">AGENT/USER lines -&gt; AI/Caller</text>
<text x="374" y="384" font-size="15" fill="#374151">Duration, est. cost, meeting_slot</text>
<text x="374" y="406" font-size="15" fill="#374151">Dedupe by call_id</text>
<rect x="680" y="110" width="300" height="40" rx="8" fill="#15803d"/>
<text x="830" y="137" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">CONTEXT</text>
<text x="990" y="137" font-size="24" fill="#6b7280" text-anchor="middle">›</text>
<rect x="680" y="164" width="300" height="88" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
<text x="694" y="191" font-size="17" font-weight="700" fill="#111827">services.md</text>
<text x="694" y="216" font-size="15" fill="#374151">What we do / don't do, service</text>
<text x="694" y="238" font-size="15" fill="#374151">area: Pune + PCMC</text>
<rect x="680" y="266" width="300" height="88" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
<text x="694" y="293" font-size="17" font-weight="700" fill="#111827">pricing.md</text>
<text x="694" y="318" font-size="15" fill="#374151">Indicative only: NEVER quote</text>
<text x="694" y="340" font-size="15" fill="#374151">-&gt; deflection line + price guard</text>
<rect x="680" y="368" width="300" height="88" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
<text x="694" y="395" font-size="17" font-weight="700" fill="#111827">qualified.md (Nikhil's rubric)</text>
<text x="694" y="420" font-size="15" fill="#374151">5 criteria; fail = decline,</text>
<text x="694" y="442" font-size="15" fill="#374151">unclear = ask one question</text>
<rect x="680" y="470" width="300" height="110" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
<text x="694" y="497" font-size="17" font-weight="700" fill="#111827">Thresholds (config.ts)</text>
<text x="694" y="522" font-size="15" fill="#374151">Lead time &gt;= 6 weeks</text>
<text x="694" y="544" font-size="15" fill="#374151">Office 500-3,000 sq ft</text>
<text x="694" y="566" font-size="15" fill="#374151">Budget floor 3.5 lakh</text>
<rect x="1000" y="110" width="300" height="40" rx="8" fill="#1d4ed8"/>
<text x="1150" y="137" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">PROCESSING</text>
<text x="1310" y="137" font-size="24" fill="#6b7280" text-anchor="middle">›</text>
<rect x="1000" y="164" width="300" height="88" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1014" y="191" font-size="17" font-weight="700" fill="#111827">extract.ts</text>
<text x="1014" y="216" font-size="15" fill="#374151">Transcript -&gt; structured Facts</text>
<text x="1014" y="238" font-size="15" fill="#374151">Validated; never trusted blindly</text>
<rect x="1000" y="266" width="300" height="132" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1014" y="293" font-size="17" font-weight="700" fill="#111827">qualify.ts (pure rules)</text>
<text x="1014" y="318" font-size="15" fill="#374151">Real project | Area | Timeline</text>
<text x="1014" y="340" font-size="15" fill="#374151">Budget | Decision-maker</text>
<text x="1014" y="362" font-size="15" fill="#374151">-&gt; forward / decline /</text>
<text x="1014" y="384" font-size="15" fill="#374151">clarify / escalate</text>
<rect x="1000" y="412" width="300" height="88" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1014" y="439" font-size="17" font-weight="700" fill="#111827">pricing-guard.ts</text>
<text x="1014" y="464" font-size="15" fill="#374151">Audit agent turns for any</text>
<text x="1014" y="486" font-size="15" fill="#374151">quoted number or rate</text>
<rect x="1000" y="514" width="300" height="88" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1014" y="541" font-size="17" font-weight="700" fill="#111827">handoff.ts</text>
<text x="1014" y="566" font-size="15" fill="#374151">Designer note with everything</text>
<text x="1014" y="588" font-size="15" fill="#374151">already asked. No price, ever.</text>
<rect x="1320" y="110" width="300" height="40" rx="8" fill="#7e22ce"/>
<text x="1470" y="137" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
<text x="1630" y="137" font-size="24" fill="#6b7280" text-anchor="middle">›</text>
<rect x="1320" y="164" width="300" height="110" rx="10" fill="#fff" stroke="#7e22ce" stroke-width="2"/>
<text x="1334" y="191" font-size="17" font-weight="700" fill="#111827">Vaani voice agent</text>
<text x="1334" y="216" font-size="15" fill="#374151">Converses by the prompt; one</text>
<text x="1334" y="238" font-size="15" fill="#374151">question per turn; books the</text>
<text x="1334" y="260" font-size="15" fill="#374151">consultation via Cal.com</text>
<rect x="1320" y="288" width="300" height="88" rx="10" fill="#fff" stroke="#7e22ce" stroke-width="2"/>
<text x="1334" y="315" font-size="17" font-weight="700" fill="#111827">Gemini Flash</text>
<text x="1334" y="340" font-size="15" fill="#374151">Extracts facts only.</text>
<text x="1334" y="362" font-size="15" fill="#374151">Never decides who qualifies.</text>
<rect x="1320" y="390" width="300" height="88" rx="10" fill="#fff" stroke="#7e22ce" stroke-width="2"/>
<text x="1334" y="417" font-size="17" font-weight="700" fill="#111827">Offline fallback</text>
<text x="1334" y="442" font-size="15" fill="#374151">Heuristic reader if Gemini</text>
<text x="1334" y="464" font-size="15" fill="#374151">is down or has no key</text>
<rect x="1640" y="110" width="300" height="40" rx="8" fill="#be123c"/>
<text x="1790" y="137" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">OUTPUT</text>
<rect x="1640" y="164" width="300" height="88" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/>
<text x="1654" y="191" font-size="17" font-weight="700" fill="#111827">Telegram (handoff channel)</text>
<text x="1654" y="216" font-size="15" fill="#374151">Lead + transcript reply +</text>
<text x="1654" y="238" font-size="15" fill="#374151">Claim button, first claim wins</text>
<rect x="1640" y="266" width="300" height="88" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/>
<text x="1654" y="293" font-size="17" font-weight="700" fill="#111827">HubSpot CRM</text>
<text x="1654" y="318" font-size="15" fill="#374151">Contact upserted by phone</text>
<text x="1654" y="340" font-size="15" fill="#374151">+ deal. No price stored.</text>
<rect x="1640" y="368" width="300" height="88" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/>
<text x="1654" y="395" font-size="17" font-weight="700" fill="#111827">Supabase</text>
<text x="1654" y="420" font-size="15" fill="#374151">1 row per call, call_id key,</text>
<text x="1654" y="442" font-size="15" fill="#374151">RLS on, service key only</text>
<rect x="1640" y="470" width="300" height="110" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/>
<text x="1654" y="497" font-size="17" font-weight="700" fill="#111827">Dashboard + Cal.com</text>
<text x="1654" y="522" font-size="15" fill="#374151">Volume, outcomes, after-hours,</text>
<text x="1654" y="544" font-size="15" fill="#374151">cost per call / qualified lead</text>
<text x="1654" y="566" font-size="15" fill="#374151">Consultation slot booked</text>
<rect x="40" y="622" width="1920" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="60" y="652" font-size="18" font-weight="700" fill="#92400e">The Cut (not built): quoting standard per-sq-ft pricing</text>
<text x="60" y="678" font-size="16" fill="#451a03">pricing.md is "indicative only, varies by site". Quoting would create commitments the studio cannot honour, so the agent deflects every price question and still books the consultation.</text>
<text x="60" y="700" font-size="16" fill="#451a03">Failure handling: bad token = 401 · duplicate delivery = no-op · each integration isolated with a timeout · missing credentials = that integration skipped, rest still runs.</text>
</svg>